<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Rounded Square App Launcher Background in Dark Navy -->
  <rect width="512" height="512" rx="112" fill="#0f172a" />

  <!-- Subtle Specular Inset Rim Gradient -->
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#rimGradient)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Stopwatch Top Crown & Pushers (Gold #f59e0b) -->
  <g id="crown-and-pushers">
    <!-- Top Crown Base & Button -->
    <rect x="236" y="58" width="40" height="38" rx="6" fill="#f59e0b" />
    <rect x="220" y="44" width="72" height="18" rx="6" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <line x1="238" y1="53" x2="274" y2="53" stroke="#92400e" stroke-width="2" stroke-linecap="round" />

    <!-- Left Lap Pusher (10 o'clock) -->
    <g transform="rotate(-32 145 130)">
      <rect x="133" y="104" width="24" height="26" rx="5" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
      <rect x="125" y="94" width="40" height="12" rx="4" fill="#fbbf24" />
    </g>

    <!-- Right Start/Stop Pusher (2 o'clock) -->
    <g transform="rotate(32 367 130)">
      <rect x="355" y="104" width="24" height="26" rx="5" fill="#f59e0b" stroke="#d97706" stroke-width="2" />
      <rect x="347" y="94" width="40" height="12" rx="4" fill="#fbbf24" />
    </g>
  </g>

  <!-- Stopwatch Outer Bezel & Case Body -->
  <circle cx="256" cy="292" r="172" fill="#1e293b" stroke="#f59e0b" stroke-width="16" />
  <circle cx="256" cy="292" r="160" stroke="#fbbf24" stroke-width="3" stroke-opacity="0.6" />

  <!-- Dial Face -->
  <circle cx="256" cy="292" r="154" fill="#0b1020" />

  <!-- Inner Subtle Minutes Subdial (Top) -->
  <circle cx="256" cy="232" r="44" fill="#0f172a" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.5" />
  <!-- Subdial Ticks -->
  <line x1="256" y1="190" x2="256" y2="198" stroke="#fbbf24" stroke-width="2" />
  <line x1="298" y1="232" x2="290" y2="232" stroke="#fbbf24" stroke-width="2" />
  <line x1="256" y1="274" x2="256" y2="266" stroke="#fbbf24" stroke-width="2" />
  <line x1="214" y1="232" x2="222" y2="232" stroke="#fbbf24" stroke-width="2" />
  <!-- Subdial Needle in Gold -->
  <line x1="256" y1="232" x2="274" y2="216" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="256" cy="232" r="3.5" fill="#fbbf24" />

  <!-- Major Dial Tick Marks (12, 3, 6, 9) in Gold -->
  <line x1="256" y1="144" x2="256" y2="164" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" />
  <line x1="256" y1="420" x2="256" y2="440" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" />
  <line x1="108" y1="292" x2="128" y2="292" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" />
  <line x1="384" y1="292" x2="404" y2="292" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" />

  <!-- Intermediate 5-second ticks -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
    <!-- 30 deg intervals -->
    <line x1="326" y1="170" x2="317" y2="186" />
    <line x1="378" y1="222" x2="362" y2="231" />
    <line x1="378" y1="362" x2="362" y2="353" />
    <line x1="326" y1="414" x2="317" y2="398" />
    <line x1="186" y1="414" x2="195" y2="398" />
    <line x1="134" y1="362" x2="150" y2="353" />
    <line x1="134" y1="222" x2="150" y2="231" />
    <line x1="186" y1="170" x2="195" y2="186" />
  </g>

  <!-- Split Chronograph Hands (Emerald & Rose) -->
  <!-- Rose #f43f5e Split Lap Hand (pointing ~10 o'clock: angle ~-55 deg) -->
  <g transform="rotate(-52 256 292)">
    <line x1="256" y1="292" x2="256" y2="166" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="256" y1="292" x2="256" y2="324" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <circle cx="256" cy="180" r="4.5" fill="#f43f5e" />
  </g>

  <!-- Emerald #10b981 Main Sweep Hand (pointing ~2 o'clock: angle +38 deg) -->
  <g transform="rotate(38 256 292)">
    <line x1="256" y1="292" x2="256" y2="152" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="292" x2="256" y2="332" stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <!-- Counterweight teardrop ring -->
    <circle cx="256" cy="320" r="7" stroke="#10b981" stroke-width="3" fill="#0b1020" />
    <circle cx="256" cy="168" r="5" fill="#34d399" />
  </g>

  <!-- Central Gold Pivot Hub with Jeweled Cap -->
  <circle cx="256" cy="292" r="13" fill="#f59e0b" stroke="#78350f" stroke-width="2" />
  <circle cx="256" cy="292" r="7" fill="#fef3c7" />

  <!-- Linear Gradients -->
  <defs>
    <linearGradient id="rimGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
</svg>
