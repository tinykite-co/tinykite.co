<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141B33"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB23C"/>
      <stop offset="100%" stop-color="#FF9000"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  
  <!-- Speed lines -->
  <path d="M70 200 H140 M50 256 H120 M70 312 H140" stroke="#2AA48F" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Sleek Racecar body -->
  <path d="M160 300 L210 230 Q250 200 330 200 L410 260 L450 300 Q460 320 440 330 L180 330 Q150 330 160 300 Z" fill="url(#accent)"/>
  
  <!-- Cockpit / Windshield -->
  <path d="M250 230 Q280 215 330 220 L370 260 L240 260 Z" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Front Wheel -->
  <circle cx="390" cy="330" r="42" fill="#0B1020" stroke="#FFFFFF" stroke-width="10"/>
  <circle cx="390" cy="330" r="18" fill="#FFB23C"/>
  
  <!-- Rear Wheel -->
  <circle cx="210" cy="330" r="42" fill="#0B1020" stroke="#FFFFFF" stroke-width="10"/>
  <circle cx="210" cy="330" r="18" fill="#2AA48F"/>

  <!-- Rear Spoiler -->
  <path d="M150 250 L180 250 L195 285 L140 285 Z" fill="#2AA48F"/>
  <rect x="135" y="240" width="60" height="12" rx="6" fill="#FFFFFF"/>

  <!-- 11+ Flag / Checkered Badge -->
  <g transform="translate(360, 100)">
    <circle cx="40" cy="40" r="36" fill="#2AA48F"/>
    <text x="40" y="47" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">11+</text>
  </g>
</svg>
